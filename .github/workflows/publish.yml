name: Publish

# Publishes tagged versions to the Maven repository served by GitHub Pages:
# https://team4256.github.io/jSI/maven

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the version matches the tag
        run: |
          if ! git tag --points-at HEAD | grep -Fxq "$GITHUB_REF_NAME"; then
            echo "$GITHUB_REF_NAME does not point to HEAD"
            exit 1
          fi

      - name: Build and test
        run: ./gradlew build

      - name: Check out gh-pages
        run: |
          if git fetch origin gh-pages; then
            git worktree add pages origin/gh-pages
          else
            git worktree add --detach pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf --quiet .
          fi

          touch pages/.nojekyll

      - name: Publish Maven repository
        run: |
          version="${GITHUB_REF_NAME#v}"

          if [ -e "pages/maven/io/github/jacobboling2040/jsi/$version" ]; then
            echo "$version is already published."
            exit 1
          fi

          ./gradlew :jsi:publishJsiPublicationToPagesRepository \
            -PpagesRepo="$PWD/pages/maven"

      - name: Push gh-pages
        run: |
          cd pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit --quiet -m "Publish $GITHUB_REF_NAME"
          git push origin HEAD:gh-pages

      - name: Check out main for README update
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update README version
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"

          sed -i -E \
            "s/(io\.github\.jacobboling2040:jsi:)[^']+/\1${version}/g" \
            Readme.md

      - name: Open README update pull request
        if: ${{ !contains(github.ref_name, '-') }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: docs/update-version-${{ github.ref_name }}
          base: main
          commit-message: "Update README for ${{ github.ref_name }}"
          title: "Update README for ${{ github.ref_name }}"
          body: |
            Automatically update the README dependency version
            to `${{ github.ref_name }}`.