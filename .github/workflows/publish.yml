name: Publish

# Pushing a tag such as v0.1.0 builds and tests jSI, then publishes it
# to the Maven repository served by GitHub Pages:
#
# https://team4256.github.io/jSI/maven
#
# Published versions are never replaced.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the version matches the tag
        run: |
          described=$(git describe --tags --always)

          if [ "$described" != "$GITHUB_REF_NAME" ]; then
            echo "git describe gives $described, not $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build and test
        run: ./gradlew build

      - name: Check out gh-pages
        run: |
          if git fetch origin gh-pages; then
            git worktree add pages origin/gh-pages
          else
            git worktree add --detach pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf --quiet .
          fi

          touch pages/.nojekyll

      - name: Publish Maven repository
        run: |
          version="${GITHUB_REF_NAME#v}"

          if [ -e "pages/maven/io/github/jacobboling2040/jsi/$version" ]; then
            echo "$version is already published."
            exit 1
          fi

          ./gradlew :jsi:publishJsiPublicationToPagesRepository \
            -PpagesRepo="$PWD/pages/maven"

      - name: Push gh-pages
        run: |
          cd pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit --quiet -m "Publish $GITHUB_REF_NAME"
          git push origin HEAD:gh-pages