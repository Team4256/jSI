plugins {
    // Allows automatic download of JDKs for the toolchains below.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'jSI'

// Consumers depend on 'jsi' alone, which bundles the three modules below into
// one jar. The modules stay separate so each keeps its own dependencies.

// Annotations only. No dependencies, by design.
include('annotations')

// Compile-time machinery: the SIUnit model and the javac plugin.
include('checker')

// Runtime helpers that ship in consumers' programs: unit conversions.
include('runtime')

// The single published artifact: the three modules above in one jar.
include('jsi')
