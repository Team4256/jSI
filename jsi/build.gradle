plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.github.jacobboling2040'

def described = providers.exec {
    commandLine 'git', 'describe', '--tags', '--always'
    ignoreExitValue = true
}

def githubTag = System.getenv('GITHUB_REF_NAME')

if (githubTag) {
    version = githubTag.replaceFirst(/^v/, '')
} else {
    def described = providers.exec {
        commandLine 'git', 'describe', '--tags', '--always'
        ignoreExitValue = true
    }

    version = described.result.get().exitValue == 0
            ? described.standardOutput.asText.get().trim().replaceFirst(/^v/, '')
            : '0.0.0-SNAPSHOT'
}

configurations {
    bundled {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    bundled project(':annotations')
    bundled project(':runtime')
    bundled project(':checker')
}

def bundledJars = configurations.bundled

tasks.named('jar') {
    dependsOn bundledJars
    from { bundledJars.collect { zipTree(it) } }
    exclude 'META-INF/MANIFEST.MF'
}

publishing {
    repositories {
        maven {
            name = 'pages'
            url = providers.gradleProperty('pagesRepo')
                    .map { file(it) }
                    .orElse(layout.buildDirectory.dir('pages-repo').get().asFile)
        }
    }

    publications {
        jsi(MavenPublication) {
            from components.java

            pom {
                name = 'jSI'
                description = 'Compile-time SI unit checking for Java, at zero runtime cost.'
                url = 'https://github.com/Team4256/jSI'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'jacobboling2040'
                        name = 'Jacob Boling'
                    }
                }

                scm {
                    url = 'https://github.com/Team4256/jSI'
                    connection = 'scm:git:git://github.com/Team4256/jSI.git'
                    developerConnection = 'scm:git:ssh://git@github.com/Team4256/jSI.git'
                }
            }
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}